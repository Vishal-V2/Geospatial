services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    environment:
      - GEO_DATABASE_URL=sqlite:///./data/geo.db
      - GEO_MAX_UPLOAD_MB=50
      - GEO_MAX_UNZIPPED_MB=300
      - GEO_MAX_FEATURES=100000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped